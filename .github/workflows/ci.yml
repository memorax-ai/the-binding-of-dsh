name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.22.3, 24.11.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  upstream:
    name: Gateway (${{ matrix.os }}, DSH ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dsh: [0.1.5-rc.2, 0.1.6-alpha.2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: memorax-ai/dsh-harmony
          ref: 5fa207af8ddf55b7853d1eb0a28f31de6b2fa118
          path: .ci/harmony
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: .ci/harmony
      - name: Install isolated upstream
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          echo '{"private":true}' > "$RUNNER_TEMP/upstream/package.json"
          npm install --prefix "$RUNNER_TEMP/upstream" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@${{ matrix.dsh }}"
          find "$RUNNER_TEMP/upstream/node_modules" -path '*/@deepseek-ai/dsh-scope/lib/index.js' -print
      - name: Verify native RPC, events and cancellation
        shell: bash
        run: node test/upstream.e2e.mjs "$RUNNER_TEMP/upstream" "$GITHUB_WORKSPACE/.ci/harmony/lib/bin.js"
